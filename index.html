<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<title>SHANFILX</title>

<style>
:root{
  --bg:#070B1A;
  --text:#F8FAFC;
  --muted:#A7B0C5;
  --accent:#8B5CF6;
  --accent2:#6366F1;
  --accent3:#A78BFA;
  --accent-blue:#6366F1;
  --rating:#FACC15;
  --glass:rgba(255,255,255,0.06);
  --glass-soft:rgba(255,255,255,0.045);
  --glass-strong:rgba(255,255,255,0.08);
  --border:rgba(255,255,255,0.12);
  --border-soft:rgba(255,255,255,0.08);
  --danger:#ef4444;
  --success:#22c55e;
  --warning:#f59e0b;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  touch-action: manipulation;
}
html{ scroll-behavior: auto !important; }

button, .movieCard, .dpEpBox, .menuItem, .settingItem, .heroDot,
[data-open], [data-play], [data-nav], [data-profile-nav], [data-toggle],
[data-sec], [data-help], [data-faq]{
  touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
}

html,body{
  margin:0; padding:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  overscroll-behavior-y:none;
}

body{ min-height:100vh; position:relative; }

button,input,select{ font:inherit; }

button{
  border:0; cursor:pointer; position:relative; overflow:hidden;
  transition: transform .08s ease, background .12s ease, opacity .08s ease !important;
}
button:active{ transform: scale(.96) !important; }

.ripple{ position:relative; overflow:hidden; }
.ripple::after{
  content:""; position:absolute; inset:0;
  background:radial-gradient(circle at center, rgba(255,255,255,.35) 0%, transparent 70%);
  opacity:0; transform:scale(0); transition:opacity .2s, transform .3s;
  pointer-events:none;
}
.ripple:active::after{ opacity:1; transform:scale(2.5); transition:0s; }

.hidden{ display:none!important; }

#pageLoader{
  position:fixed; inset:0; z-index:9999; background:#070B1A;
  display:flex; align-items:center; justify-content:center;
  animation:fadeOut .4s ease forwards; animation-delay:.1s;
}
@keyframes fadeOut{ to{opacity:0; visibility:hidden;} }
.loaderBox{ text-align:center; }
.loaderLogo{
  font-size:32px; font-weight:900; letter-spacing:6px; color:var(--accent3);
  margin-bottom:24px; animation:glow 1.8s ease-in-out infinite;
}
@keyframes glow{
  0%,100%{ text-shadow:0 0 20px #8b5cf688, 0 0 40px #8b5cf644; transform:scale(1); }
  50%{ text-shadow:0 0 30px #a78bfa, 0 0 60px #8b5cf6aa; transform:scale(1.03); }
}
.spinner{
  width:40px; height:40px; border:3px solid #ffffff10; border-top-color:var(--accent3);
  border-radius:50%; animation:spin .8s linear infinite; margin:auto;
}
@keyframes spin{ to{transform:rotate(360deg)} }

#authScreen{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:20px; position:relative; z-index:1; animation:authFade .3s ease;
}
@keyframes authFade{ from{opacity:0;} to{opacity:1;} }
.authCard{
  width:100%; max-width:420px; padding:30px 26px; border-radius:26px;
  background:var(--glass);
  backdrop-filter: blur(10px) saturate(1.4) !important;
  -webkit-backdrop-filter: blur(10px) saturate(1.4) !important;
  border:1px solid var(--border);
  box-shadow:0 30px 80px rgba(0,0,0,.6), 0 0 60px rgba(139,92,246,.15),
    inset 0 1px 0 rgba(255,255,255,.15), inset 0 -1px 0 rgba(0,0,0,.25);
  position:relative; overflow:hidden;
}
.authCard::before{
  content:""; position:absolute; top:0; left:-50%; width:200%; height:1px;
  background:linear-gradient(90deg, transparent, rgba(167,139,250,.6), rgba(99,102,241,.6), transparent);
  animation:shimmer 3s linear infinite;
}
@keyframes shimmer{ 0%{ transform:translateX(-50%); } 100%{ transform:translateX(50%); } }
.authLogo{
  font-size:28px; font-weight:900; letter-spacing:4px; color:var(--accent3);
  margin-bottom:22px; text-shadow:0 0 25px rgba(167,139,250,.55);
}
.authCard h1{ margin:0 0 8px; font-size:24px; letter-spacing:-.3px; }
.authSub{ color:var(--muted); margin-bottom:22px; font-size:14px; }
.field{ margin-bottom:14px; }
.field label{ display:block; color:var(--muted); font-size:12px; font-weight:600; margin-bottom:6px; letter-spacing:.3px; }
.input{
  width:100%; padding:14px 15px; background:rgba(255,255,255,.04);
  border:1px solid var(--border); color:var(--text); border-radius:12px;
  outline:none; font-size:15px;
  transition:border-color .15s, background .15s, box-shadow .15s;
}
.input::placeholder{ color:rgba(167,176,197,.6); }
.input:focus{
  border-color:rgba(167,139,250,.6); background:rgba(255,255,255,.07);
  box-shadow:0 0 0 3px rgba(139,92,246,.18), 0 0 20px rgba(139,92,246,.15);
}
.passwordWrap{ position:relative; width:100%; }
.passwordWrap .input{ padding-right:52px; }
.passwordToggle{
  position:absolute; top:50%; right:6px; transform:translateY(-50%);
  width:40px; height:40px; border-radius:10px; background:transparent;
  color:var(--muted); display:flex; align-items:center; justify-content:center;
  transition:color .15s, background .15s, transform .1s; padding:0; z-index:2;
}
.passwordToggle:hover{ color:var(--text); background:var(--glass-strong); }
.passwordToggle svg{ width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.passwordToggle.visible{ color:var(--accent3); }

.primaryBtn{
  width:100%; padding:15px; color:#fff; border-radius:12px;
  font-weight:800; font-size:15px; letter-spacing:.3px; margin-top:8px;
  background:linear-gradient(135deg, rgba(139,92,246,.85), rgba(99,102,241,.85));
  border:1px solid rgba(255,255,255,.18);
  box-shadow:0 8px 25px rgba(139,92,246,.4),
    inset 0 1px 0 rgba(255,255,255,.25), inset 0 -1px 0 rgba(0,0,0,.2);
  position:relative; overflow:hidden;
}
.primaryBtn::before{
  content:""; position:absolute; top:0; left:0; right:0; height:50%;
  background:linear-gradient(180deg, rgba(255,255,255,.15), transparent);
  pointer-events:none;
}
.secondaryBtn{
  padding:11px 16px; background:var(--glass);
  backdrop-filter: blur(10px) saturate(1.4) !important;
  -webkit-backdrop-filter: blur(10px) saturate(1.4) !important;
  color:var(--text); border-radius:11px; font-weight:700; font-size:13px;
  border:1px solid var(--border);
}
.authLinks{ margin-top:18px; text-align:center; font-size:13px; }
.textBtn{ background:none; color:var(--accent3); font-weight:700; padding:4px 6px; border-radius:6px; }

#app{ padding-bottom:calc(96px + env(safe-area-inset-bottom)); animation:appFade .3s ease; position:relative; z-index:1; }
@keyframes appFade{ from{opacity:0;} to{opacity:1;} }

.header{
  height:60px; position:fixed; top:0; left:0; right:0; z-index:100;
  display:flex; align-items:center; gap:12px; padding:0 16px;
  padding-top:env(safe-area-inset-top);
  background:rgba(11,15,32,.5);
  backdrop-filter: blur(10px) saturate(1.4) !important;
  -webkit-backdrop-filter: blur(10px) saturate(1.4) !important;
  border-bottom:1px solid transparent;
  transition:background .2s, border-color .2s;
}
.header.scrolled{
  background:rgba(11,15,32,.7);
  border-bottom-color:var(--border-soft);
}
.logo{
  color:var(--accent3); font-weight:900; letter-spacing:3.5px; font-size:18px;
  white-space:nowrap; text-shadow:0 0 20px rgba(167,139,250,.5);
}
.desktopNav{ display:none; gap:4px; }
.desktopNav button{
  color:var(--muted); background:none; padding:8px 12px; font-size:14px; border-radius:8px;
}
.desktopNav button.active{
  color:var(--text); background:var(--glass-strong);
  border:1px solid var(--border);
}
.searchBox{
  margin-left:auto; display:flex; align-items:center; gap:7px;
  background:var(--glass);
  backdrop-filter: blur(10px) saturate(1.4) !important;
  -webkit-backdrop-filter: blur(10px) saturate(1.4) !important;
  border:1px solid var(--border); border-radius:12px; padding:0 12px;
  width:100%; max-width:270px;
  transition:border-color .15s, box-shadow .15s, background .15s;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 4px 15px rgba(0,0,0,.3);
}
.searchBox:focus-within{
  border-color:rgba(167,139,250,.55); background:rgba(255,255,255,.07);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1), 0 0 0 3px rgba(139,92,246,.15), 0 0 25px rgba(139,92,246,.25);
}
.searchBox input{ width:100%; border:0; outline:0; background:none; color:var(--text); padding:9px 2px; font-size:14px; }
.searchBox input::placeholder{ color:rgba(167,176,197,.7); }

.hero{ height:600px; position:relative; overflow:hidden; }
.heroSlide{
  position:absolute; inset:0; opacity:0; transition:opacity .8s ease;
  background-size:cover; background-position:center; transform:scale(1.05);
}
.heroSlide.active{ opacity:1; animation:heroZoom 8s ease-out; }
@keyframes heroZoom{ from{transform:scale(1.12);} to{transform:scale(1.02);} }
.heroOverlay{
  position:absolute; inset:0; z-index:2;
  background:
    linear-gradient(180deg, rgba(7,11,26,.3) 0%, transparent 30%, rgba(7,11,26,.4) 60%, rgba(7,11,26,.95) 100%),
    linear-gradient(90deg, rgba(7,11,26,.65) 0%, transparent 60%);
}
.heroContent{
  position:absolute; z-index:5; left:14px; right:14px; bottom:20px;
  max-width:680px; padding:22px 22px 20px; border-radius:22px;
  background:rgba(11,15,32,.45);
  backdrop-filter: blur(10px) saturate(1.4) !important;
  -webkit-backdrop-filter: blur(10px) saturate(1.4) !important;
  border:1px solid var(--border);
  box-shadow:0 20px 60px rgba(0,0,0,.6), 0 0 40px rgba(139,92,246,.12),
    inset 0 1px 0 rgba(255,255,255,.14), inset 0 -1px 0 rgba(0,0,0,.25);
  animation:heroContent .3s ease; overflow:hidden;
}
@keyframes heroContent{ from{opacity:0; transform:translateY(20px);} to{opacity:1; transform:translateY(0);} }
.heroBadge{
  display:inline-block; color:var(--accent3); font-size:10px; font-weight:800;
  letter-spacing:2.5px; text-transform:uppercase; padding:5px 10px;
  background:rgba(139,92,246,.18);
  border-radius:6px; margin-bottom:12px; border:1px solid rgba(167,139,250,.35);
  text-shadow:0 0 10px rgba(167,139,250,.5);
}
.heroTitle{ font-size:34px; line-height:1.05; margin:0 0 10px; letter-spacing:-1px; font-weight:900; text-shadow:0 4px 20px rgba(0,0,0,.6); }
.heroMeta{ display:flex; flex-wrap:wrap; gap:10px; font-size:13px; color:rgba(248,250,252,.85); margin-bottom:10px; }
.heroMeta span{ display:flex; align-items:center; gap:4px; }
.heroDescription{
  color:rgba(226,232,245,.85); line-height:1.55; max-width:600px;
  font-size:14px; margin:0 0 18px;
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
}
.heroActions{ display:flex; gap:10px; margin-top:16px; }
.playBtn{
  padding:13px 24px; border-radius:12px;
  background:linear-gradient(135deg, rgba(255,255,255,.95), rgba(226,232,255,.9));
  color:#070B1A; font-weight:800; font-size:14px;
  display:flex; align-items:center; gap:8px;
  box-shadow:0 8px 25px rgba(255,255,255,.15), inset 0 1px 0 #fff, inset 0 -2px 4px rgba(0,0,0,.08);
}
.listBtn{
  padding:13px 20px; border-radius:12px;
  background:var(--glass-strong);
  backdrop-filter: blur(10px) saturate(1.4) !important;
  -webkit-backdrop-filter: blur(10px) saturate(1.4) !important;
  color:var(--text); font-weight:700; font-size:14px;
  border:1px solid rgba(255,255,255,.15);
  display:flex; align-items:center; gap:8px;
  box-shadow:0 8px 25px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.12);
}
.heroDots{ position:absolute; z-index:10; bottom:26px; right:26px; display:flex; gap:6px; }
.heroDot{
  width:6px; height:6px; border-radius:99px; background:rgba(255,255,255,.35);
  transition:all .3s ease; cursor:pointer;
}
.heroDot.active{ width:24px; background:#fff; box-shadow:0 0 12px rgba(255,255,255,.85), 0 0 20px rgba(167,139,250,.6); }

.section{ padding:14px 16px 0; animation:sectionFade .35s ease; }
@keyframes sectionFade{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
.sectionHead{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; padding:0 2px; }
.sectionTitle{ font-size:18px; margin:0; font-weight:800; letter-spacing:-.3px; text-shadow:0 2px 10px rgba(0,0,0,.5); }
.seeAll{
  background:var(--glass);
  color:var(--accent3); font-size:12px; font-weight:700;
  padding:7px 12px; border-radius:9px;
  border:1px solid rgba(167,139,250,.25);
}
.cardRow{
  display:flex; gap:12px; overflow-x:auto; scrollbar-width:none;
  padding-bottom:16px; padding-top:2px; scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;
}
.cardRow::-webkit-scrollbar{ display:none; }
.movieCard{ flex:0 0 135px; cursor:pointer; transition: transform .1s ease !important; }
.movieCard:active{ transform: scale(.94) !important; }
.movieCard:active .poster{ filter: brightness(.85) !important; }
.poster{
  width:100%; aspect-ratio:2/3; border-radius:14px; overflow:hidden;
  background:rgba(255,255,255,.04); position:relative;
  border:1px solid var(--border);
  box-shadow:0 8px 25px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.12), 0 0 20px rgba(139,92,246,.1);
}
.poster img{ width:100%; height:100%; object-fit:cover; display:block; filter:saturate(1.05); }
.poster::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(255,255,255,.08) 0%, transparent 25%, transparent 70%, rgba(0,0,0,.35) 100%);
  pointer-events:none; z-index:1;
}
.rating{
  position:absolute; left:8px; bottom:8px; padding:4px 8px;
  background:rgba(7,11,26,.65);
  border-radius:8px; font-size:10px; font-weight:700;
  border:1px solid rgba(255,255,255,.15); z-index:3;
  box-shadow:0 4px 12px rgba(0,0,0,.4);
  color:var(--rating);
}
.cardTitle{
  margin-top:9px; font-size:13px; font-weight:700;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  padding:0 2px; text-shadow:0 1px 4px rgba(0,0,0,.6);
}
.cardMeta{ margin-top:3px; color:var(--muted); font-size:11px; padding:0 2px; }
.progress{
  height:3px; background:rgba(255,255,255,.08); margin-top:7px;
  border-radius:99px; overflow:hidden; margin-left:2px; margin-right:2px;
}
.progress span{
  display:block; height:100%;
  background:linear-gradient(90deg,var(--accent),var(--accent-blue));
  border-radius:99px; transition:width .3s ease;
  box-shadow:0 0 8px rgba(139,92,246,.6);
}

.page{ padding:78px 16px 24px; animation:pageFade .18s ease; }
@keyframes pageFade{ from{opacity:0;} to{opacity:1;} }
.pageTitle{ margin:0 0 18px; font-size:22px; font-weight:900; letter-spacing:-.5px; text-shadow:0 2px 12px rgba(0,0,0,.5); }
.grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
.grid .movieCard{ width:auto; }

.profilePage{ padding-top:82px; }

.userCard{
  display:flex; align-items:center; gap:16px;
  padding:20px;
  background:var(--glass);
  backdrop-filter: blur(10px) saturate(1.4) !important;
  -webkit-backdrop-filter: blur(10px) saturate(1.4) !important;
  border:1px solid var(--border);
  border-radius:22px;
  margin-bottom:20px;
  box-shadow:0 15px 45px rgba(0,0,0,.5), 0 0 40px rgba(139,92,246,.1),
    inset 0 1px 0 rgba(255,255,255,.14), inset 0 -1px 0 rgba(0,0,0,.2);
  position:relative; overflow:hidden;
}
.userAvatarWrap{ position:relative; flex:0 0 auto; }
.userAvatar{
  width:72px; height:72px; border-radius:50%;
  object-fit:cover; background:var(--glass);
  border:2px solid rgba(167,139,250,.5);
  box-shadow:0 0 25px rgba(139,92,246,.6), inset 0 2px 4px rgba(0,0,0,.3);
  position:relative; z-index:1;
}
.userAvatarGlow{
  position:absolute; inset:-8px; border-radius:50%;
  background:radial-gradient(circle, rgba(139,92,246,.5) 0%, transparent 70%);
  filter:blur(8px); z-index:0;
}
.userInfo{ flex:1; min-width:0; }
.userName{ margin:0 0 4px; font-size:22px; font-weight:800; letter-spacing:-.4px; }
.userEmail{
  margin:0 0 8px; color:var(--muted); font-size:13px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.userBadge{
  display:inline-block; padding:4px 10px;
  background:linear-gradient(135deg, rgba(139,92,246,.35), rgba(99,102,241,.35));
  border:1px solid rgba(167,139,250,.5); border-radius:99px;
  font-size:10px; font-weight:800; letter-spacing:1.5px;
  color:var(--accent3); text-transform:uppercase;
  box-shadow:0 0 15px rgba(139,92,246,.35);
}

.profileMenu{
  background:var(--glass-soft);
  backdrop-filter: blur(10px) saturate(1.4) !important;
  -webkit-backdrop-filter: blur(10px) saturate(1.4) !important;
  border:1px solid var(--border);
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 15px 45px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.12);
}
.menuItem{
  display:flex; align-items:center; gap:14px; width:100%;
  padding:16px 18px;
  background:transparent; color:var(--text);
  border-bottom:1px solid rgba(255,255,255,.05);
  text-align:left; font-size:15px; font-weight:600;
  position:relative;
}
.menuItem:last-child{ border-bottom:0; }
.menuItem:active{ background:var(--glass-strong); }
.menuIcon{
  width:26px; height:26px; flex:0 0 auto;
  display:flex; align-items:center; justify-content:center;
  color:var(--accent3);
  filter:drop-shadow(0 0 8px rgba(167,139,250,.5));
}
.menuIcon svg{
  width:20px; height:20px;
  stroke:currentColor; fill:none;
  stroke-width:2; stroke-linecap:round; stroke-linejoin:round;
}
.menuLabel{ flex:1; }
.menuChevron{
  flex:0 0 auto; color:rgba(167,176,197,.5);
  display:flex; align-items:center;
}
.menuChevron svg{ width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
.menuItemDanger .menuIcon{ color:var(--danger); }
.menuItemDanger .menuLabel{ color:var(--danger); }

.subPageHeader{
  display:flex; align-items:center; gap:14px;
  margin-bottom:22px; padding:0 2px;
}
.subBackBtn{
  width:42px; height:42px; border-radius:50%;
  background:var(--glass-strong);
  backdrop-filter: blur(10px) saturate(1.4) !important;
  -webkit-backdrop-filter: blur(10px) saturate(1.4) !important;
  color:var(--text);
  display:flex; align-items:center; justify-content:center;
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 4px 15px rgba(0,0,0,.5);
  flex:0 0 auto;
}
.subBackBtn svg{ width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
.subPageTitle{ font-size:22px; font-weight:900; letter-spacing:-.4px; margin:0; }

.settingGroup{
  background:var(--glass-soft);
  backdrop-filter: blur(10px) saturate(1.4) !important;
  -webkit-backdrop-filter: blur(10px) saturate(1.4) !important;
  border:1px solid var(--border);
  border-radius:20px;
  margin-bottom:16px;
  overflow:hidden;
  box-shadow:0 12px 40px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.12);
}
.settingGroupTitle{
  padding:14px 18px 4px;
  font-size:11px; font-weight:800; letter-spacing:1.5px;
  text-transform:uppercase; color:var(--accent3);
  text-shadow:0 0 10px rgba(167,139,250,.4);
}
.settingItem{
  display:flex; align-items:center; gap:14px;
  padding:15px 18px;
  border-bottom:1px solid rgba(255,255,255,.05);
  color:var(--text); font-size:14px; font-weight:600;
  background:transparent; width:100%; text-align:left;
}
.settingItem:last-child{ border-bottom:0; }
.settingItem:active{ background:var(--glass-strong); }
.settingIcon{
  width:26px; height:26px; flex:0 0 auto;
  display:flex; align-items:center; justify-content:center;
  color:var(--accent3);
  filter:drop-shadow(0 0 8px rgba(167,139,250,.5));
}
.settingIcon svg{ width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.settingLabel{ flex:1; min-width:0; }
.settingLabel small{ display:block; color:var(--muted); font-size:11px; font-weight:500; margin-top:2px; }

.switch{
  position:relative; width:48px; height:28px; flex:0 0 auto;
  border-radius:99px;
  background:rgba(255,255,255,.1);
  border:1px solid var(--border);
  transition:background .2s, box-shadow .2s;
  cursor:pointer;
}
.switch::after{

/* =========================================================

function isPublished(item){
  if(!item || typeof item !== "object") return false;
  let flag;
  if(item.published       !== undefined) flag = item.published;
  else if(item.isPublished !== undefined) flag = item.isPublished;
  else if(item.publish     !== undefined) flag = item.publish;
  else if(item.status      !== undefined) flag = item.status;
  else if(item.visible     !== undefined) flag = item.visible;

  if(flag === undefined || flag === null || flag === "") return true;
  if(typeof flag === "boolean") return flag;
  if(typeof flag === "number")  return flag !== 0;

  const s = String(flag).trim().toLowerCase();
  return !["false","0","no","off","draft","unpublished","hidden","private","pending","disable","disabled"].includes(s);
}

function videoUrlOf(obj){
  if(!obj || typeof obj !== "object") return "";
  const keys = ["videoUrl","videoURL","video_url","video","url","link","src","source",
                "streamUrl","stream_url","embedUrl","embed","file","playUrl","m3u8","watchUrl"];
  for(const k of keys){
    const v = obj[k];
    if(typeof v === "string" && v.trim()) return v.trim();
    if(v && typeof v === "object"){
      const nested = v.url || v.link || v.src || v.hls || v.file || v.videoUrl || v.playUrl;
      if(typeof nested === "string" && nested.trim()) return nested.trim();
    }
  }
  return "";
}

/* =========================================================
   DOWNLOAD SYSTEM — FIXED
   Admin যেই ফিল্ডে download link দিক, সব ডিটেক্ট করবে
========================================================= */

function extractUrlFromValue(v){
  if(typeof v === "string" && v.trim()) return v.trim();
  if(v && typeof v === "object"){
    const keys = ["url","link","src","href","file","downloadUrl","downloadURL","dl","source"];
    for(const k of keys){
      if(typeof v[k] === "string" && v[k].trim()) return v[k].trim();
    }
  }
  return "";
}

function downloadUrlOf(obj){
  if(!obj || typeof obj !== "object") return "";

  // case-insensitive + separator-insensitive key map
  const keyMap = {};
  Object.keys(obj).forEach(k => {
    keyMap[k.toLowerCase().replace(/[\s_\-\.]/g, "")] = k;
  });

  // Common admin field names
  const knownKeys = [
    "downloadurl","downloadlink","download_url","download_link",
    "directdownload","direct_download","filedownload","file_download",
    "downloadfile","download_file","downloadpath","download_path",
    "dlurl","dllink","dl_url","dl_link",
    "saveurl","save_url","fileurl","file_url",
    "download","dl"
  ];

  for(const k of knownKeys){
    const realKey = keyMap[k];
    if(realKey){
      const url = extractUrlFromValue(obj[realKey]);
      if(url) return url;
    }
  }

  // যেকোনো key যাতে "download" আছে
  for(const k of Object.keys(obj)){
    if(/download/i.test(k)){
      const url = extractUrlFromValue(obj[k]);
      if(url) return url;
    }
  }

  // Quality based download object: downloads: { 720p: "...", 1080p: "..." }
  if(obj.downloads && typeof obj.downloads === "object" && !Array.isArray(obj.downloads)){
    const order = ["2160p","4k","1080p","720p","480p","360p","high","medium","low","hd","sd","auto"];
    for(const q of order){
      if(obj.downloads[q]){
        const url = extractUrlFromValue(obj.downloads[q]);
        if(url) return url;
      }
    }
    for(const k of Object.keys(obj.downloads)){
      const url = extractUrlFromValue(obj.downloads[k]);
      if(url) return url;
    }
  }

  // Array based links
  for(const arrKey of ["downloadLinks","downloadUrls","download_links","downloads_list"]){
    if(Array.isArray(obj[arrKey])){
      for(const entry of obj[arrKey]){
        const url = extractUrlFromValue(entry);
        if(url) return url;
      }
    }
  }

  return "";
}

function episodeEntries(season){
  if(!season || typeof season !== "object") return [];
  let eps = season.episodes || season.episode || null;
  if(!eps){
    const numeric = Object.keys(season).filter(k => /^\d+$/.test(k));
    if(numeric.length){
      eps = {};
      numeric.forEach(k => { eps[k] = season[k]; });
    }
  }
  if(!eps || typeof eps !== "object") return [];
  if(Array.isArray(eps)){
    return eps
      .map((ep, i) => [String(i + 1), ep || {}])
      .filter(([, ep]) => isPublished(ep));
  }
  return Object.entries(eps)
    .filter(([, ep]) => ep && typeof ep === "object" && isPublished(ep))
    .sort((a, b) => (Number(a[0]) || 0) - (Number(b[0]) || 0));
}

/* =========================================================
   IMAGE COMPRESSION
========================================================= */
function compressImage(file, maxSize = 400, quality = 0.85){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("FileReader error"));
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = () => reject(new Error("Image load error"));
      img.onload = () => {
        try {
          let { width, height } = img;
          const scale = Math.min(1, maxSize / Math.max(width, height));
          width  = Math.max(1, Math.round(width  * scale));
          height = Math.max(1, Math.round(height * scale));

          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.fillStyle = "#0B1024";
          ctx.fillRect(0, 0, width, height);
          ctx.drawImage(img, 0, 0, width, height);

          const dataUrl = canvas.toDataURL("image/jpeg", quality);
          resolve(dataUrl);
        } catch(err){
          reject(err);
        }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function dataUrlToBlob(dataUrl){
  const parts = dataUrl.split(",");
  const mime = (parts[0].match(/:(.*?);/) || [,"image/jpeg"])[1];
  const bin  = atob(parts[1]);
  const len  = bin.length;
  const buf  = new Uint8Array(len);
  for(let i = 0; i < len; i++) buf[i] = bin.charCodeAt(i);
  return new Blob([buf], { type: mime });
}

/* =========================================================
   DOWNLOAD HANDLING
========================================================= */
function getCurrentDownloadTarget(){
  const item = currentDetail.item;
  if(!item) return null;

  const baseTitle = item.title || "video";

  // TV show হলে episode level এর লিংক খুঁজবো
  if(item.seasons && Object.keys(item.seasons).length){
    const seasonNum = currentDetail.selectedSeason
      || Object.keys(item.seasons).sort((a,b) => Number(a) - Number(b))[0];
    const season = item.seasons[seasonNum];
    const episodes = episodeEntries(season);

    // Active episode
    const activeEpBox = document.querySelector('#dpEpisodes .dpEpBox.active');
    const activeEp = activeEpBox ? activeEpBox.dataset.ep : null;

    if(activeEp && activeEp !== "all"){
      const found = episodes.find(([num]) => String(num) === String(activeEp));
      if(found){
        const url = downloadUrlOf(found[1]);
        if(url) return { url, title: baseTitle + " S" + seasonNum + "E" + activeEp };
      }
    }

    // প্রথম episode যেটাতে download link আছে
    for(const [num, ep] of episodes){
      const url = downloadUrlOf(ep);
      if(url) return { url, title: baseTitle + " S" + seasonNum + "E" + num };
    }

    // Season level
    const seasonUrl = downloadUrlOf(season);
    if(seasonUrl) return { url: seasonUrl, title: baseTitle + " Season " + seasonNum };
  }

  // Movie / overall item level
  const itemUrl = downloadUrlOf(item);
  if(itemUrl) return { url: itemUrl, title: baseTitle };

  // Fallback: streaming URL কে download link হিসেবে দেব
  const fallbackVideoUrl = videoUrlOf(item);
  if(fallbackVideoUrl) return { url: fallbackVideoUrl, title: baseTitle };

  return null;
}

function triggerDirectDownload(url, title){
  if(!url) return false;

  const safeName = String(title || "video")
    .replace(/[^\w\s\-\.]/g, "_")
    .replace(/\s+/g, "_")
    .slice(0, 80) || "video";

  const isSameOrigin = (() => {
    try {
      const u = new URL(url, location.href);
      return u.origin === location.origin;
    } catch(e){ return false; }
  })();

  try {
    const a = document.createElement("a");
    a.href = url;
    a.download = safeName;
    a.rel = "noopener noreferrer";
    if(!isSameOrigin) a.target = "_blank";
    a.style.display = "none";
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { try { document.body.removeChild(a); } catch(e){} }, 350);
    return true;
  } catch(err){
    console.error("Download failed:", err);
    try { window.open(url, "_blank", "noopener"); } catch(e){}
    return true;
  }
}

function downloadCurrentItem(){
  const item = currentDetail.item;
  if(!item){ return; }

  const target = getCurrentDownloadTarget();

  if(!target || !target.url){
    haptic();
    toast("এই কনটেন্টে download link নেই");
    return;
  }

  haptic(15);

  // DB তে save করি
  if(state.user){
    const safeKey = (currentDetail.key || "item")
      .replace(/[.#$[\]/]/g, '_') + "_" + Date.now();
    db.ref("users/" + state.user.uid + "/downloads/" + safeKey).set({
      title: target.title,
      url: target.url,
      poster: poster(item),
      contentKey: currentDetail.key,
      downloadedAt: firebase.database.ServerValue.TIMESTAMP
    }).catch(()=>{});
  }

  triggerDirectDownload(target.url, target.title);
  toast("Download শুরু হচ্ছে ✓");
}

function togglePasswordVisibility(){
  const input = $("passwordInput");
  const toggle = $("passwordToggle");
  const eyeIcon = $("eyeIcon");
  const eyeOffIcon = $("eyeOffIcon");
  state.passwordVisible = !state.passwordVisible;
  if(state.passwordVisible){
    input.type = "text";
    input.setAttribute("autocomplete","off");
    toggle.classList.add("visible");
    eyeIcon.style.display = "none";
    eyeOffIcon.style.display = "block";
  } else {
    input.type = "password";
    input.setAttribute("autocomplete","current-password");
    toggle.classList.remove("visible");
    eyeIcon.style.display = "block";
    eyeOffIcon.style.display = "none";
  }
  haptic(5);
  const val = input.value;
  input.focus();
  try { input.setSelectionRange(val.length, val.length); } catch(e){}
}

$("passwordToggle").addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); togglePasswordVisibility(); });
$("passwordToggle").addEventListener("mousedown", e => e.preventDefault());

function showAuth(mode){
  state.authMode = mode;
  $("authScreen").classList.remove("hidden");
  $("app").classList.add("hidden");
  $("authError").classList.add("hidden");
  resetPasswordField();

  if(mode === "login"){
    $("authTitle").textContent = "Welcome Back";
    $("authSub").textContent = "Sign in to continue watching.";
    $("nameField").classList.add("hidden");
    $("passwordField").classList.remove("hidden");
    $("passwordInput").required = true;
    $("authSubmit").textContent = "Login";
    $("authSwitch").textContent = "Create Account";
    $("resetBtn").classList.remove("hidden");
  }
  if(mode === "register"){
    $("authTitle").textContent = "Create Account";
    $("authSub").textContent = "Create your SHANFILX account.";
    $("nameField").classList.remove("hidden");
    $("passwordField").classList.remove("hidden");
    $("passwordInput").required = true;
    $("authSubmit").textContent = "Register";
    $("authSwitch").textContent = "Back to Login";
    $("resetBtn").classList.add("hidden");
  }
}

function resetPasswordField(){
  state.passwordVisible = false;
  const input = $("passwordInput");
  input.type = "password";
  $("passwordToggle").classList.remove("visible");
  $("eyeIcon").style.display = "block";
  $("eyeOffIcon").style.display = "none";
  input.value = "";
}

$("authSwitch").onclick = () => { haptic(); showAuth(state.authMode === "login" ? "register" : "login"); };

$("resetBtn").onclick = () => {
  haptic();
  const email = $("emailInput").value.trim();
  if(!email){ $("authError").textContent = "Enter your email first."; $("authError").classList.remove("hidden"); return; }
  auth.sendPasswordResetEmail(email).then(() => toast("Password reset email sent."))
    .catch(error => { $("authError").textContent = error.message; $("authError").classList.remove("hidden"); });
};

$("authForm").onsubmit = async event => {
  event.preventDefault();
  $("authError").classList.add("hidden");
  try{
    const email = $("emailInput").value.trim();
    const password = $("passwordInput").value;
    if(state.authMode === "login"){ await auth.signInWithEmailAndPassword(email, password); }
    if(state.authMode === "register"){
      const name = $("nameInput").value.trim() || "User";
      const result = await auth.createUserWithEmailAndPassword(email, password);
      await db.ref("users/" + result.user.uid).set({
        name:name, email:email, photo:"",
        createdAt: firebase.database.ServerValue.TIMESTAMP, role:"user"
      });
    }
  } catch(error){
    $("authError").textContent = error.message;
    $("authError").classList.remove("hidden");
  }
};

auth.onAuthStateChanged(async user => {
  setTimeout(() => $("pageLoader").classList.add("hidden"), 300);
  state.user = user;
  if(!user){ showAuth("login"); return; }
  $("authScreen").classList.add("hidden");
  $("app").classList.remove("hidden");
  await loadUserData();
  render("home");
});

async function loadUserData(){
  const readFirst = async (paths) => {
    for(const p of paths){
      try{
        const snap = await db.ref(p).once("value");
        const val = snap.val();
        if(val && typeof val === "object" && Object.keys(val).length) return val;
      } catch(e){ }
    }
    return {};
  };

  try{
    const results = await Promise.all([
      readFirst(["movies","Movies","content/movies"]),
      readFirst(["tvShows","tvshows","TVShows","tv_shows","tv","content/tvShows"]),
      readFirst(["kdrama","KDrama","kDrama","k-drama","kdramas","content/kdrama"]),
      readFirst(["anime","Anime","Animes","content/anime"]),
      db.ref("users/" + state.user.uid).once("value"),
      db.ref("users/" + state.user.uid + "/myList").once("value"),
      db.ref("users/" + state.user.uid + "/watchHistory").once("value"),
      db.ref("users/" + state.user.uid + "/settings").once("value"),
      db.ref("users/" + state.user.uid + "/downloads").once("value")
    ]);

    state.content = {
      movies:  results[0] || {},
      tvShows: results[1] || {},
      kdrama:  results[2] || {},
      anime:   results[3] || {}
    };

    state.profile = results[4].val() || { name: state.user.displayName || "User", email: state.user.email };
    state.myList  = results[5].val() || {};
    state.history = results[6].val() || {};
    state.downloads = results[8].val() || {};

    const savedSettings = results[7].val() || {};
    state.settings = Object.assign({}, state.settings, savedSettings);
  } catch(error){
    console.error(error);
    toast("Could not load some data.");
  }
}

function allContent(){
  return Object.entries(state.content)
    .flatMap(([type, obj]) => arr(obj).map(item => ({ ...item, type })))
    .filter(isPublished);
}

function published(type){
  return arr(state.content[type]).filter(isPublished);
}

function createCard(item){
  const key = item.type + ":" + item.id;
  const history = state.history[key];
  let progressHTML = "";
  if(history && history.duration > 0 && history.progress > 0){
    const percent = Math.min(100, history.progress / history.duration * 100);
    progressHTML = `<div class="progress"><span style="width:${percent}%"></span></div>`;
  }
  return `
    <article class="movieCard" data-open="${esc(key)}">
      <div class="poster">
        <img loading="lazy" src="${esc(poster(item))}" alt="${esc(item.title)}" onerror="this.src='${APP.PLACEHOLDER}'">
        <span class="rating">★ ${esc(item.rating || "—")}</span>
      </div>
      <div class="cardTitle">${esc(item.title || "Untitled")}</div>
      <div class="cardMeta">${esc(item.year || "")}${item.language ? " · " + esc(item.language) : ""}</div>
      ${progressHTML}
    </article>
  `;
}

function createRow(title,items){
  if(!items.length) return "";
  return `
    <section class="section">
      <div class="sectionHead">
        <h2 class="sectionTitle">${esc(title)}</h2>
        <button class="seeAll ripple">See all</button>
      </div>
      <div class="cardRow">${items.slice(0,20).map(createCard).join("")}</div>
    </section>
  `;
}

function renderHome(){
  const all = allContent();

  if(!all.length){
    $("main").innerHTML = `<div class="page" style="padding-top:120px"><div class="empty">No content available yet.</div></div>`;
    return;
  }

  let heroes = all.filter(item => item.featured || item.trending).slice(0,6);
  if(!heroes.length) heroes = all.slice(0,6);
  if(state.heroIndex >= heroes.length) state.heroIndex = 0;

  const current = heroes[state.heroIndex];

  let heroSlides = "";
  heroes.forEach((item,index) => {
    heroSlides += `<div class="heroSlide ${index === state.heroIndex ? "active" : ""}" style="background-image:url('${esc(backdrop(item))}')"></div>`;
  });

  let heroContent = "";
  if(current){
    const key = current.type + ":" + current.id;
    heroContent = `
      <div class="heroBadge">FEATURED</div>
      <h1 class="heroTitle">${esc(current.title)}</h1>
      <div class="heroMeta">
        <span>★ ${esc(current.rating || "—")}</span>
        <span>·</span>
        <span>${esc(current.year || "")}</span>
        <span>·</span>
        <span>${esc(current.genre || "")}</span>
      </div>
      <p class="heroDescription">${esc(current.description || "Discover something new on SHANFILX.")}</p>
      <div class="heroActions">
        <button class="playBtn ripple" data-play="${esc(key)}">▶ Play</button>
        <button class="listBtn ripple" data-list="${esc(key)}">${state.myList[key] ? "✓ In List" : "+ My List"}</button>
      </div>
    `;
  }

  const dots = heroes.map((_,i) => `<i class="heroDot ${i === state.heroIndex ? "active" : ""}" data-hero="${i}"></i>`).join("");

  const trending = all.filter(item => item.trending);
  const tv = published("tvShows");
  const kdrama = published("kdrama");
  const anime = published("anime");
  const recent = [...all].sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0));
  const topRated = [...all].sort((a,b) => (+b.rating || 0) - (+a.rating || 0));
  const continueWatching = all.filter(item => state.history[item.type + ":" + item.id]);

  $("main").innerHTML = `
    <section class="hero">
      ${heroSlides}
      <div class="heroOverlay"></div>
      <div class="heroContent">${heroContent}</div>
      <div class="heroDots">${dots}</div>
    </section>
    ${createRow("Trending Now", trending)}
    ${createRow("New Releases", recent)}
    ${createRow("Continue Watching", continueWatching)}
    ${createRow("Top Rated", topRated)}
    ${createRow("TV Shows", tv)}
    ${createRow("K-Drama", kdrama)}
    ${createRow("Anime", anime)}
  `;

  clearInterval(state.heroTimer);
  if(heroes.length > 1){
    state.heroTimer = setInterval(() => {
      state.heroIndex = (state.heroIndex + 1) % heroes.length;
      renderHome();
    }, 7000);
  }
}

function searchContent(query){
  const q = query.trim().toLowerCase();
  const results = allContent().filter(item => {
    if(!q) return true;
    return [item.title, item.genre, item.year, item.language, item.description]
      .some(value => String(value || "").toLowerCase().includes(q));
  });
  const box = $("searchResults");
  if(!box) return;
  box.innerHTML = results.length
    ? `<div class="grid">${results.map(createCard).join("")}</div>`
    : `<div class="empty">${q ? "No results found." : "Start searching."}</div>`;
}

function renderProfileEdit(){
  const photo = state.profile?.photo || "https://placehold.co/150x150/070B1A/F8FAFC?text=U";
  const name = state.profile?.name || "User";
  const email = state.profile?.email || state.user.email;

      ${subPageHeader("Profile")}

      <div class="userCard" style="justify-content:center;flex-direction:column;text-align:center;padding:26px 20px">

          <div class="userAvatarGlow"></div>

        </div>

        <input type="file" id="avatarFileInput" accept="image/*" style="display:none">
        <button class="secondaryBtn ripple" id="changeAvatarBtn" style="margin-top:6px">Change Photo</button>
      </div>

      <div class="settingGroup">
        <div class="settingGroupTitle">Basic Info</div>
        <div class="editRow">
          <label>Display Name</label>
          <input class="input" id="editName" value="${esc(name)}" placeholder="Your name">
        </div>
        <div class="editRow">
          <label>Email Address</label>
          <input class="input" id="editEmail" value="${esc(email)}" disabled style="opacity:.6;cursor:not-allowed">
        </div>
        <div class="editRow">
          <label>Bio (Optional)</label>
          <input class="input" id="editBio" value="${esc(state.profile?.bio || "")}" placeholder="Tell us about yourself...">
        </div>
      </div>

      <button class="primaryBtn ripple" id="saveProfileBtn">Save Changes</button>
    </div>
  `;

  const fileInput = $("avatarFileInput");
  const changeBtn = $("changeAvatarBtn");
  const previewImg = $("avatarPreview");

  changeBtn.onclick = () => { haptic(); fileInput.click(); };

  fileInput.onchange = async (e) => {
    const file = e.target.files && e.target.files[0];
    if(!file) return;

    if(!file.type.startsWith("image/")){
      toast("Please select an image file");
      fileInput.value = "";
      return;
    }
    if(file.size > 10 * 1024 * 1024){
      toast("Image must be under 10MB");
      fileInput.value = "";
      return;
    }

    changeBtn.disabled = true;
    changeBtn.textContent = "Preparing...";

    try {
      const compressedDataUrl = await compressImage(file, 400, 0.85);
      previewImg.src = compressedDataUrl;
      state._pendingPhoto = compressedDataUrl;

      changeBtn.textContent = "Uploading...";

      try {
        const ext = "jpg";
        const path = `avatars/${state.user.uid}/${Date.now()}.${ext}`;
        const storageRef = storage.ref(path);
        const blob = dataUrlToBlob(compressedDataUrl);

        const uploadTask = storageRef.put(blob, { contentType: "image/jpeg" });

        uploadTask.on("state_changed", (snapshot) => {
          const total = snapshot.totalBytes || 1;
          const progress = (snapshot.bytesTransferred / total) * 100;
          changeBtn.textContent = `Uploading ${Math.round(progress)}%`;
        });

        const timeout = new Promise((_, reject) =>
          setTimeout(() => reject(new Error("Upload timeout")), 12000)
        );

        const snapshot = await Promise.race([uploadTask, timeout]);
        const downloadURL = await snapshot.ref.getDownloadURL();

        state._pendingPhoto = downloadURL;
        previewImg.src = downloadURL;
        toast("Photo ready ✓ Tap Save Changes");
      } catch (storageErr){
        console.warn("Storage upload failed, using base64:", storageErr);
        state._pendingPhoto = compressedDataUrl;
        previewImg.src = compressedDataUrl;
        toast("Photo ready ✓ (local) Tap Save Changes");
      }
    } catch (err){
      console.error("Image processing failed:", err);
      toast("Could not process image");
    } finally {
      changeBtn.disabled = false;
      changeBtn.textContent = "Change Photo";
      fileInput.value = "";
    }
  };

  $("saveProfileBtn").onclick = async () => {
    haptic();
    const newName = $("editName").value.trim();
    const newBio = $("editBio").value.trim();
    const newPhoto = state._pendingPhoto || state.profile?.photo || "";

    if(!newName){ toast("Name can't be empty"); return; }

    const btn = $("saveProfileBtn");
    const originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = "Saving...";

    try{
      const update = { name:newName, bio:newBio, photo:newPhoto };
      await db.ref("users/" + state.user.uid).update(update);
      state.profile = Object.assign({}, state.profile, update);
      delete state._pendingPhoto;
      toast("Profile updated ✓");
      setTimeout(() => { state.profileSubPage = null; renderProfile(); }, 400);
    } catch(e){
      console.error(e);
      toast("Update failed: " + (e.message || ""));
    } finally {
      btn.disabled = false;
      btn.textContent = originalText;
    }
  };
}

function handleSecurityAction(action){
  const user = auth.currentUser;
  switch(action){
    case "change-email": {
      const newEmail = prompt("Enter new email address:");
      if(!newEmail || !newEmail.includes("@")) return;
      user.updateEmail(newEmail.trim())
        .then(async () => {
          await db.ref("users/" + user.uid).update({ email:newEmail.trim() });
          state.profile.email = newEmail.trim();
          toast("Email updated ✓");
        })
        .catch(err => toast(err.message));
      break;
    }
    case "change-password": {
      const newPass = prompt("Enter new password (min 6 chars):");
      if(!newPass || newPass.length < 6){ toast("Password too short"); return; }
      user.updatePassword(newPass)
        .then(() => toast("Password updated ✓"))
        .catch(err => toast(err.message));
      break;
    }
    case "reset-password": {
      user.email && auth.sendPasswordResetEmail(user.email)
        .then(() => toast("Reset link sent"))
        .catch(err => toast(err.message));
      break;
    }
    case "delete-account": {
      if(!confirm("Delete your account permanently? This can't be undone.")) return;
      user.delete()
        .then(() => { toast("Account deleted"); auth.signOut(); })
        .catch(err => toast(err.message));
      break;
    }
  }
}

async function saveSetting(key, value){
  state.settings[key] = value;
  try{
    await db.ref("users/" + state.user.uid + "/settings/" + key).set(value);
  } catch(e){ console.error("saveSetting failed", e); }
}

function render(page){
  state.page = page;
  state.profileSubPage = null;
  document.querySelectorAll("[data-nav]").forEach(button => {
    button.classList.toggle("active", button.dataset.nav === page);
  });
  clearInterval(state.heroTimer);
  if(page === "home") renderHome();
  else if(page === "movies") renderCollection("movies","Movies");
  else if(page === "tvShows") renderCollection("tvShows","TV Shows");
  else if(page === "kdrama") renderCollection("kdrama","K-Drama");
  else if(page === "anime") renderCollection("anime","Anime");
  else if(page === "mylist") renderMyList();
  else if(page === "profile") renderProfile();
  else if(page === "search") renderSearch($("globalSearch").value);
}

document.addEventListener("pointerup", event => {
  const nav = event.target.closest("[data-nav]");
  if(nav){ haptic(); render(nav.dataset.nav); return; }

  const open = event.target.closest("[data-open]");
  if(open){ haptic(); openDetail(open.dataset.open); return; }

  const play = event.target.closest("[data-play]");
  if(play){ haptic(); openDetail(play.dataset.play); return; }

  const list = event.target.closest("[data-list]");
  if(list){ haptic(); toggleMyList(list.dataset.list); return; }

  const hero = event.target.closest("[data-hero]");
  if(hero){ haptic(); state.heroIndex = Number(hero.dataset.hero); renderHome(); return; }

  const pnav = event.target.closest("[data-profile-nav]");
  if(pnav){
    haptic();
    const key = pnav.dataset.profileNav;
    if(key === "logout"){
      if(confirm("Are you sure you want to logout?")) auth.signOut();
    } else {
      state.profileSubPage = key;
      renderProfileSubPage(key);
      window.scrollTo({ top:0, behavior:"auto" });
    }
    return;
  }

  const pback = event.target.closest("[data-profile-back]");
  if(pback){
    haptic();
    state.profileSubPage = null;
    renderProfile();
    window.scrollTo({ top:0, behavior:"auto" });
    return;
  }

  const sw = event.target.closest("[data-toggle]");
  if(sw){
    haptic();
    const key = sw.dataset.toggle;
    state.settings[key] = !state.settings[key];
    sw.classList.toggle("on", state.settings[key]);
    saveSetting(key, state.settings[key]);
    return;
  }
}, { passive: true });

async function toggleMyList(key){
  if(!state.user) return;
  const ref = db.ref("users/" + state.user.uid + "/myList/" + key);
  try{
    if(state.myList[key]){ await ref.remove(); delete state.myList[key]; toast("Removed from My List"); }
    else{ await ref.set(true); state.myList[key] = true; toast("Added to My List"); }
    if(!$("detailPage").classList.contains("hidden")){ renderDetailPage(); return; }
    if(state.profileSubPage){ renderProfileSubPage(state.profileSubPage); return; }
    render(state.page);
  } catch(error){ console.error(error); toast("Could not update My List"); }
}

function openDetail(key){
  const parts = key.split(":");
  const type = parts[0];
  const id = parts[1];
  const item = state.content[type]?.[id];
  if(!item) return;

  currentDetail.key = key;
  currentDetail.type = type;
  currentDetail.id = id;
  currentDetail.item = item;
  currentDetail.selectedLanguage = item.language || "";

  if(item.seasons && Object.keys(item.seasons).length){
    const seasonKeys = Object.keys(item.seasons).sort((a,b) => Number(a) - Number(b));
    currentDetail.selectedSeason = seasonKeys[0] || "1";
  } else { currentDetail.selectedSeason = null; }

  const dp = $("detailPage");
  dp.classList.remove("closing", "hidden");
  renderDetailPage();
  dp.scrollTop = 0;
}

function closeDetail(){
  const dp = $("detailPage");
  dp.classList.add("hidden");
  dp.classList.remove("closing");
  if(state.page === "home") renderHome();
}

  const inList = !!state.myList[key];

  const hasSeasons = !!(item.seasons && Object.keys(item.seasons).length > 0);
  const seasonCount = hasSeasons ? Object.keys(item.seasons).length : 0;
  const typeLabel = { movies:"Movie", tvShows:"TV Show", kdrama:"K-Drama", anime:"Anime" }[type] || type;

  const metaChips = [

  if(item.genre) metaChips.push(`<span>${esc(item.genre)}</span>`);
  if(item.duration) metaChips.push(`<span>${esc(item.duration)}</span>`);
  if(hasSeasons) metaChips.push(`<span>${seasonCount} Season${seasonCount>1?"s":""}</span>`);

  const langOptions = (() => {
    const langs = new Set();
    if(item.language) langs.add(item.language);
    ["English","Korean","Japanese","Hindi","Spanish"].forEach(l => langs.add(l));
    return Array.from(langs).map(l => `<option value="${esc(l)}" ${l === currentDetail.selectedLanguage ? "selected" : ""}>${esc(l)}</option>`).join("");
  })();

  const seasonOptions = hasSeasons
    ? Object.keys(item.seasons).sort((a,b) => Number(a) - Number(b))
        .map(s => `<option value="${esc(s)}" ${s === currentDetail.selectedSeason ? "selected" : ""}>Season ${esc(s)}</option>`).join("")
    : "";

  const episodeChipsHTML = hasSeasons ? renderEpisodeChips(item.seasons[currentDetail.selectedSeason]) : "";

  const relatedItems = allContent().filter(x => x.type === type && x.id !== currentDetail.id).slice(0, 12);

  $("detailPage").innerHTML = `
    <div class="dpHero" style="background-image:url('${esc(backdrop(item))}')">
      <button class="dpBackBtn ripple" id="dpBack">←</button>
      <button class="dpMoreBtn ripple" id="dpMore">⋮</button>
      <button class="dpBigPlay ripple" id="dpBigPlay">▶</button>
      <div id="inlineVideoContainer" class="hidden"></div>
    </div>

    <div class="dpInfo">
      <h1 class="dpTitle">
        <span>${esc(item.title)}</span>
        <button class="dpInfoBtn ripple" id="dpInfoBtn">INFO</button>
      </h1>
      <div class="dpMetaRow">${metaChips.join("")}</div>
      <p class="dpDescription" style="color:rgba(226,232,245,.85);line-height:1.6;font-size:13px;margin:0 0 4px;">
        ${esc(item.description || "No description available.")}
      </p>
    </div>

    <div class="dpActions">
      <button class="dpActionBtn ripple ${inList ? "active" : ""}" id="dpAddList">
        ${inList ? "✓ In My List" : "＋ Add to list"}
      </button>
      <button class="dpActionBtn ripple" id="dpShare">↗ Share</button>
      <button class="dpActionBtn ripple" id="dpDownload">⇩ Download</button>
      <button class="dpActionBtn ripple" id="dpViewDownload">⇩ View downloads</button>
    </div>

    ${hasSeasons ? `
      <div class="dpResources">
        <div class="dpResHead">
          <div class="dpResTitle">Resources</div>
          <div class="dpUploader"><span class="dpUploaderIcon">S</span>${esc(item.uploader || "SHANFILX")}</div>
        </div>
        <div class="dpDropdowns">
          <select class="dpSelect" id="dpLangSelect">${langOptions}</select>
          <select class="dpSelect" id="dpSeasonSelect">${seasonOptions}</select>
        </div>
        <div class="dpEpisodes" id="dpEpisodes">${episodeChipsHTML}</div>
      </div>
    ` : ""}

    <div class="dpForYou">
      <div class="dpForYouTitle">For you</div>
      <button class="dpCommentsBtn ripple">Comments <span class="dpCommentsDot"></span></button>
    </div>

    <div class="dpRelatedGrid">${relatedItems.map(createCard).join("")}</div>
  `;

  bindDetailEvents();
}

function renderEpisodeChips(season){
  const episodes = episodeEntries(season);
  if(!episodes.length) return `<button class="dpEpBox ripple" data-ep="all">ALL</button>`;

  let html = `<button class="dpEpBox ripple" data-ep="all">ALL</button>`;
  episodes.forEach(([num]) => {
    const epKey = currentDetail.key + "#S" + currentDetail.selectedSeason + "E" + num;
    const watched = state.history[epKey] ? "watched" : "";
    html += `<button class="dpEpBox ripple ${watched}" data-ep="${esc(num)}">${esc(num)}</button>`;
  });
  return html;
}

function fastBind(el, fn){
  if(!el) return;
  let fired = false;
  el.addEventListener('pointerup', (e) => {
    e.stopPropagation();
    if(fired) return;
    fired = true;
    setTimeout(() => fired = false, 250);
    fn();
  }, { passive:true });
}

function bindDetailEvents(){
  const dp = $("detailPage");

  fastBind(dp.querySelector("#dpBack"),  () => { haptic(); closeDetail(); });
  fastBind(dp.querySelector("#dpMore"),  () => { haptic(); toast("More options coming soon"); });
  fastBind(dp.querySelector("#dpInfoBtn"), () => { haptic(); toast((currentDetail.item.description||"").slice(0,100) + "..." || "No info"); });
  fastBind(dp.querySelector("#dpBigPlay"), () => { haptic(20); playCurrentDetailInline(); });
  fastBind(dp.querySelector("#dpAddList"), () => { haptic(); toggleMyList(currentDetail.key); });
  fastBind(dp.querySelector("#dpShare"), async () => {
    haptic();
    const url = location.href.split("#")[0] + "#" + currentDetail.key;
    try{
      if(navigator.share) await navigator.share({ title:"SHANFILX", text:"Watch on SHANFILX", url });
      else { await navigator.clipboard.writeText(url); toast("Share link copied"); }
    } catch(e){}
  });
  fastBind(dp.querySelector("#dpDownload"),     () => { haptic(); downloadCurrentItem(); });
  fastBind(dp.querySelector("#dpViewDownload"), () => { haptic(); state.profileSubPage = "downloads"; render("profile"); });

  const langSelect = dp.querySelector("#dpLangSelect");
  if(langSelect) langSelect.onchange = () => { haptic(); currentDetail.selectedLanguage = langSelect.value; toast("Language: " + langSelect.value); };

  const seasonSelect = dp.querySelector("#dpSeasonSelect");
  if(seasonSelect) seasonSelect.onchange = () => {
    haptic();
    currentDetail.selectedSeason = seasonSelect.value;
    const season = currentDetail.item.seasons[currentDetail.selectedSeason];
    dp.querySelector("#dpEpisodes").innerHTML = renderEpisodeChips(season);
    bindEpisodeClicks();
  };

  bindEpisodeClicks();

  dp.querySelectorAll(".dpRelatedGrid [data-open]").forEach(el => {
    fastBind(el, () => { haptic(); openDetail(el.dataset.open); });
  });
}

function bindEpisodeClicks(){
  const dp = $("detailPage");
  const container = dp.querySelector("#dpEpisodes");
  if(!container) return;
  container.querySelectorAll(".dpEpBox").forEach(box => {
    let fired = false;
    box.addEventListener('pointerup', (e) => {
      e.stopPropagation();
      if(fired) return; fired = true;
      setTimeout(() => fired = false, 200);

      haptic();
      const ep = box.dataset.ep;
      container.querySelectorAll(".dpEpBox").forEach(b => b.classList.remove("active"));
      box.classList.add("active");
      if(ep === "all"){ playCurrentDetailInline(); return; }

      const season = currentDetail.item.seasons[currentDetail.selectedSeason];
      const found = episodeEntries(season).find(([num]) => String(num) === String(ep));
      if(!found){ toast("Episode পাওয়া যায়নি"); return; }
      const episode = found[1];
      const url = videoUrlOf(episode);
      if(!url){ toast("এই episode এ video link নেই"); return; }
      playMediaInline(currentDetail.key + "#S" + currentDetail.selectedSeason + "E" + ep, url, episode);
    }, { passive:true });
  });
}

function playCurrentDetailInline(){
  const item = currentDetail.item;
  const key = currentDetail.key;

  if(item.seasons && Object.keys(item.seasons).length){
    const seasonNum = currentDetail.selectedSeason
      || Object.keys(item.seasons).sort((a,b) => Number(a) - Number(b))[0];
    const season = item.seasons[seasonNum];
    const episodes = episodeEntries(season);

    if(episodes.length){
      const [epNum, ep] = episodes[0];
      const url = videoUrlOf(ep);
      if(!url){ toast("এই episode এ video link নেই"); return; }
      playMediaInline(key + "#S" + seasonNum + "E" + epNum, url, ep);
      return;
    }
  }

  const url = videoUrlOf(item);
  if(!url){ toast("এই কনটেন্টে video link পাওয়া যায়নি"); return; }
  playMediaInline(key, url, item);
}

function playMediaInline(key, url, meta) {
  const inlineContainer = document.getElementById('inlineVideoContainer');
  const bigPlay = document.querySelector('#dpBigPlay');
  if (!inlineContainer) return;

  bigPlay.classList.add('hidden');
  inlineContainer.classList.remove('hidden');
  inlineContainer.innerHTML = '';

  if (!url) {
    inlineContainer.innerHTML = '<div class="androidNoSource">No video source configured.</div>';
    return;
  }

  const source = String(meta.videoSource || "").toLowerCase();
  const looksIframe = source === "iframe" || source === "embed" ||
    /youtube\.com/i.test(url) || /youtu\.be/i.test(url) ||
    /vimeo\.com/i.test(url) || /\/embed\//i.test(url) || /player\.php/i.test(url);

  const shell = document.createElement('div');
  shell.className = 'androidPlayerShell';
  inlineContainer.appendChild(shell);

  if (looksIframe) buildAndroidIframePlayer(shell, url, key, meta, bigPlay, inlineContainer);
  else             buildAndroidVideoPlayer(shell, url, key, meta, bigPlay, inlineContainer);
}

function buildAndroidVideoPlayer(shell, url, key, meta, bigPlay, inlineContainer) {
  const video = document.createElement('video');
  video.src = url;
  video.playsInline = true;
  video.preload = 'auto';
  video.autoplay = true;
  video.muted = false;
  video.className = 'androidMedia';
  video.setAttribute('playsinline', '');
  video.setAttribute('webkit-playsinline', '');
  shell.appendChild(video);

  const item = currentDetail.item || {};
  const posterUrl = item.backdrop || item.poster || meta.poster || meta.backdrop || '';
  const loaderEl = document.createElement('div');
  loaderEl.className = 'androidPosterLoader';
  loaderEl.innerHTML = `
    <div class="androidPosterBg" style="background-image:url('${esc(posterUrl)}')"></div>
    <div class="androidPosterSpinner"></div>
  `;
  shell.appendChild(loaderEl);

  const hideLoader = () => loaderEl.classList.add('hidden');
  const loaderFallback = setTimeout(hideLoader, 15000);

  const tryPlay = () => {
    const p = video.play();
    if (p && typeof p.then === 'function') p.catch(() => {});
  };
  tryPlay();
  video.addEventListener('canplay', tryPlay, { once: true });
  video.addEventListener('loadeddata', tryPlay, { once: true });

  const title = meta.title || (currentDetail.item && currentDetail.item.title) || 'SHANFILX';
  const isSeries = !!(currentDetail.item && currentDetail.item.seasons);

  const overlay = document.createElement('div');
  overlay.className = 'androidOverlay show';
  overlay.innerHTML = `
    <div class="androidTopBar">
      <button class="androidIconBtn small" data-act="close">${AICONS.back}</button>
      <div class="androidTitle">${esc(title)}</div>
      <div class="nfxTopActions">
        <button class="androidIconBtn small" data-act="cast">${AICONS.cast}</button>
        ${isSeries ? `<button class="androidIconBtn small" data-act="episodes">${AICONS.episodes}</button>` : ''}
      </div>
    </div>
    <div class="androidMidBar">
      <button class="androidIconBtn" data-act="back10">${AICONS.back10}</button>
      <button class="androidIconBtn androidPlayBtn" data-act="playpause">${AICONS.play}</button>
      <button class="androidIconBtn" data-act="forward10">${AICONS.forward10}</button>
    </div>
    <div class="androidBottomBar">
      <div class="androidSeekRow">
        <span class="androidTime" data-el="current">00:00</span>
        <div class="androidSeekWrap" data-el="seek">
          <div class="androidSeekTrack">
            <div class="androidSeekBuffer"></div>
            <div class="androidSeekFill"></div>
          </div>
          <div class="androidSeekThumb"></div>
        </div>
        <span class="androidTime right" data-el="duration">00:00</span>
      </div>
      <div class="nfxBottomRow">
        <div class="nfxBottomLeft">
          <button class="androidIconBtn small" data-act="playpause-b">${AICONS.play}</button>
          <button class="androidIconBtn small" data-act="back10-b">${AICONS.back10}</button>
          <button class="androidIconBtn small" data-act="forward10-b">${AICONS.forward10}</button>
          <button class="androidIconBtn small" data-act="mute">${AICONS.volOn}</button>
        </div>
        <div class="nfxBottomRight">
          <button class="androidIconBtn small" data-act="subtitles">${AICONS.subtitles}</button>
          <button class="androidIconBtn small" data-act="fullscreen">${AICONS.fs}</button>
        </div>
      </div>
    </div>
  `;
  shell.appendChild(overlay);

  const $playA    = overlay.querySelector('[data-act="playpause"]');
  const $playB    = overlay.querySelector('[data-act="playpause-b"]');
  const $fill     = overlay.querySelector('.androidSeekFill');
  const $buffer   = overlay.querySelector('.androidSeekBuffer');
  const $thumb    = overlay.querySelector('.androidSeekThumb');
  const $seekWrap = overlay.querySelector('[data-el="seek"]');
  const $current  = overlay.querySelector('[data-el="current"]');
  const $duration = overlay.querySelector('[data-el="duration"]');
  const $mute     = overlay.querySelector('[data-act="mute"]');
  const $fs       = overlay.querySelector('[data-act="fullscreen"]');

  let hideTimer = null;
  const showOverlay = () => {
    overlay.classList.add('show');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      if (!video.paused) overlay.classList.remove('show');
    }, 3000);
  };
  const toggleOverlay = () => {
    if (overlay.classList.contains('show') && !video.paused) overlay.classList.remove('show');
    else showOverlay();
  };

  video.addEventListener('click', toggleOverlay);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) toggleOverlay(); });

  const setPlayIcon = () => {
    const ic = video.paused ? AICONS.play : AICONS.pause;
    $playA.innerHTML = ic;
    $playB.innerHTML = ic;
  };

  const bind = (el, fn) => {
    if (!el) return;
    el.addEventListener('pointerup', (e) => { e.stopPropagation(); fn(); }, { passive: true });
    el.addEventListener('click', (e) => e.stopPropagation());
  };

  const doPlayPause = () => {
    if (video.paused) { const p = video.play(); p && p.catch && p.catch(()=>{}); }
    else video.pause();
    showOverlay();
  };

  bind($playA, doPlayPause);
  bind($playB, doPlayPause);
  bind(overlay.querySelector('[data-act="back10"]'), () => {
    video.currentTime = Math.max(0, video.currentTime - 10); showOverlay();
  });
  bind(overlay.querySelector('[data-act="back10-b"]'), () => {
    video.currentTime = Math.max(0, video.currentTime - 10); showOverlay();
  });
  bind(overlay.querySelector('[data-act="forward10"]'), () => {
    video.currentTime = Math.min(video.duration || 0, video.currentTime + 10); showOverlay();
  });
  bind(overlay.querySelector('[data-act="forward10-b"]'), () => {
    video.currentTime = Math.min(video.duration || 0, video.currentTime + 10); showOverlay();
  });
  bind($mute, () => {
    video.muted = !video.muted;
    $mute.innerHTML = video.muted ? AICONS.volOff : AICONS.volOn;
    showOverlay();
  });
  bind(overlay.querySelector('[data-act="cast"]'), () => { showOverlay(); });
  bind(overlay.querySelector('[data-act="subtitles"]'), () => { showOverlay(); });

  const requestNativeFs = (el) => {
    const fn = el.requestFullscreen || el.webkitRequestFullscreen
            || el.mozRequestFullScreen || el.msRequestFullscreen;
    if (!fn) return Promise.reject();
    try { const p = fn.call(el); return (p && p.then) ? p : Promise.resolve(); }
    catch(e){ return Promise.reject(e); }
  };
  const exitNativeFs = () => {
    const fn = document.exitFullscreen || document.webkitExitFullscreen
            || document.mozCancelFullScreen || document.msExitFullscreen;
    try { fn && fn.call(document); } catch (e) {}
  };
  const isNativeFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement
      || document.mozFullScreenElement || document.msFullscreenElement);

  const lockLandscape = async () => {
    try { if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape'); } catch(e){}
  };
  const unlockOrientation = () => {
    try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch(e){}
  };

  const refreshFsIcon = () => {
    const active = isNativeFs() || shell.classList.contains('pseudo-fs');
    $fs.innerHTML = active ? AICONS.fsExit : AICONS.fs;
  };

  const enterFullscreen = async () => {
    try { await requestNativeFs(shell); } catch(e){}
    if (!isNativeFs()) { shell.classList.add('pseudo-fs'); document.body.style.overflow = 'hidden'; }
    await lockLandscape();
    refreshFsIcon();
  };
  const exitFullscreen = () => {
    if (isNativeFs()) exitNativeFs();
    shell.classList.remove('pseudo-fs');
    document.body.style.overflow = '';
    unlockOrientation();
    refreshFsIcon();
  };

  bind($fs, async () => {
    const active = isNativeFs() || shell.classList.contains('pseudo-fs');
    if (active) exitFullscreen(); else await enterFullscreen();
    showOverlay();
  });

  ['fullscreenchange','webkitfullscreenchange','mozfullscreenchange','MSFullscreenChange']
    .forEach(evt => document.addEventListener(evt, () => {
      if (!isNativeFs()) {
        shell.classList.remove('pseudo-fs');
        document.body.style.overflow = '';
      }
      refreshFsIcon();
    }));

  let lastTap = 0;
  video.addEventListener('touchend', () => {
    const now = Date.now();
    if (now - lastTap < 280) {
      const active = isNativeFs() || shell.classList.contains('pseudo-fs');
      if (!active) enterFullscreen();
      lastTap = 0;
    } else lastTap = now;
  }, { passive:true });

  const seekFromX = (clientX) => {
    if (!video.duration) return;
    const rect = $seekWrap.getBoundingClientRect();
    let ratio = (clientX - rect.left) / rect.width;
    ratio = Math.max(0, Math.min(1, ratio));
    video.currentTime = ratio * video.duration;
    updateSeekUI();
  };
  let seeking = false;
  $seekWrap.addEventListener('pointerdown', (e) => {
    seeking = true;
    try { $seekWrap.setPointerCapture(e.pointerId); } catch(err){}
    seekFromX(e.clientX);
    showOverlay();
  });
  $seekWrap.addEventListener('pointermove', (e) => { if (seeking) seekFromX(e.clientX); });
  $seekWrap.addEventListener('pointerup',   (e) => { seeking = false; seekFromX(e.clientX); });
  $seekWrap.addEventListener('pointercancel', () => { seeking = false; });

  const updateSeekUI = () => {
    if (!video.duration) return;
    const pct = (video.currentTime / video.duration) * 100;
    $fill.style.width = pct + '%';
    $thumb.style.left = pct + '%';
    $current.textContent = formatTime(video.currentTime);
    $duration.textContent = formatTime(video.duration);
  };

  video.addEventListener('loadedmetadata', () => {
    const saved = state.history[key];
    if (saved && saved.progress > 0 && saved.progress < video.duration - 5) {
      video.currentTime = saved.progress;
    }
    updateSeekUI();
    tryPlay();
    setPlayIcon();
    showOverlay();
  }, { once: true });

  video.addEventListener('playing', () => {
    clearTimeout(loaderFallback);
    hideLoader();
  }, { once: true });
  video.addEventListener('play', () => {
    setTimeout(hideLoader, 250);
  }, { once: true });

  video.addEventListener('timeupdate', updateSeekUI, { passive:true });
  video.addEventListener('play',  () => { setPlayIcon(); showOverlay(); });
  video.addEventListener('pause', () => { setPlayIcon(); showOverlay(); saveProgressInline(key, video, false); });
  video.addEventListener('ended', () => { setPlayIcon(); saveProgressInline(key, video, true); });
  video.addEventListener('progress', () => {
    if (!video.buffered.length || !video.duration) return;
    const end = video.buffered.end(video.buffered.length - 1);
    $buffer.style.width = (end / video.duration * 100) + '%';
  }, { passive:true });

  video.addEventListener('error', () => {
    clearTimeout(loaderFallback);
    hideLoader();
  });

  const saveTimer = setInterval(() => {
    if (!video.paused) saveProgressInline(key, video, false);
  }, 10000);

  const closePlayer = () => {
    exitFullscreen();
    saveProgressInline(key, video, false);
    clearInterval(saveTimer);
    clearTimeout(loaderFallback);
    video.pause();
    video.removeAttribute('src');
    video.load();
    inlineContainer.classList.add('hidden');
    inlineContainer.innerHTML = '';
    bigPlay.classList.remove('hidden');
    renderDetailPage();
  };
  bind(overlay.querySelector('[data-act="close"]'), closePlayer);

  const $epBtn = overlay.querySelector('[data-act="episodes"]');
  if ($epBtn) bind($epBtn, closePlayer);
}

function buildAndroidIframePlayer(shell, url, key, meta, bigPlay, inlineContainer) {
  const item = currentDetail.item || {};
  const posterUrl = item.backdrop || item.poster || meta.poster || meta.backdrop || '';
  const loaderEl = document.createElement('div');
  loaderEl.className = 'androidPosterLoader';
  loaderEl.innerHTML = `
    <div class="androidPosterBg" style="background-image:url('${esc(posterUrl)}')"></div>
    <div class="androidPosterSpinner"></div>
  `;
  shell.appendChild(loaderEl);

  const iframe = document.createElement('iframe');
  iframe.src = url;
  iframe.className = 'androidMedia';
  iframe.setAttribute('frameborder', '0');
  iframe.setAttribute('scrolling', 'no');
  iframe.allow = 'autoplay; fullscreen; picture-in-picture; encrypted-media';
  iframe.allowFullscreen = true;
  iframe.addEventListener('load', () => {
    setTimeout(() => loaderEl.classList.add('hidden'), 400);
  });
  setTimeout(() => loaderEl.classList.add('hidden'), 6000);
  shell.appendChild(iframe);

  const closeBtn = document.createElement('button');
  closeBtn.className = 'androidFloatClose';
  closeBtn.innerHTML = AICONS.close;
  closeBtn.setAttribute('aria-label', 'Close player');
  shell.appendChild(closeBtn);

  closeBtn.addEventListener('click', () => {
    inlineContainer.classList.add('hidden');
    inlineContainer.innerHTML = '';
    bigPlay.classList.remove('hidden');
    renderDetailPage();
  });
}

document.addEventListener("keydown", e => {
  if(e.key === "Escape"){
    if(!$("detailPage").classList.contains("hidden")){ closeDetail(); return; }
    if(state.profileSubPage){ state.profileSubPage = null; renderProfile(); }
  }
});

</script>
